applications:
  - name: ((name))
    memory: ((memory))M
    disk_quota: ((disk))M
    instances: ((instances))
    buildpacks:
      - nodejs_buildpack
    health-check-type: http
    health-check-http-endpoint: /facilities-mgmt/health
    health-check-interval: ((healthCheckInterval))
    health-check-invocation-timeout: ((healthCheckInvocationTimeout))
    env:
      OPTIMIZE_MEMORY: true
      EASEY_DB_SERVICE: ((dbSvc))
      EASEY_FACILITIES_API_HOST: ((host))
      EASEY_FACILITIES_API_PORT: ((port))
      EASEY_FACILITIES_API_PATH: ((path))
      EASEY_FACILITIES_API_TITLE: ((title))
      EASEY_FACILITIES_API_DESCRIPTION: ((description))
      EASEY_FACILITIES_API_ENV: ((environment))
      EASEY_FACILITIES_API_ENABLE_API_KEY: true
      EASEY_FACILITIES_API_ENABLE_SECRET_TOKEN: true
      EASEY_FACILITIES_API_ENABLE_CLIENT_TOKEN: true
      EASEY_FACILITIES_API_ENABLE_CORS: true
      EASEY_FACILITIES_API_ENABLE_GLOBAL_VALIDATION_PIPE: true
      EASEY_FACILITIES_API_MAX_PAGINATION_PER_PAGE: 500
      EASEY_API_GATEWAY_HOST: ((apiHost))
      EASEY_AUTH_API: https://((apiHost))/auth-mgmt
      EASEY_FACILITIES_API_ENABLE_ROLE_GUARD: true
      EASEY_FACILITIES_API_ENABLE_AUTH_TOKEN: true
      TZ: America/New_York
      EASEY_FACILITIES_CERT_OF_REP_API: ((certOfRepApi))
      EASEY_DB_MAX_CONNECTION_POOL: ((maxConnectionPool))
      EASEY_DB_IDLE_TIMEOUT: ((idleTimeout))
      EASEY_DB_CONNECTION_TIMEOUT: ((connectionTimeout))
      EASEY_DB_STATEMENT_TIMEOUT: ((statementTimeout))
      EASEY_DB_IDLE_TRANS_SESSION_TIMEOUT: ((idleInTransactionSessionTimeout))
      EASEY_DB_MAX_USES_BEFORE_CONN_RECREATE: ((maxUsesBeforeRecreatingConnection))
      EASEY_DB_SQL_LOGGING: ((sqlLogging))
      EASEY_DB_MAX_QUERY_EXECUTION_TIMEOUT: ((maxQueryExecutionTime))
      EASEY_DB_HEALTH_TIMEOUT: ((dbHealthTimeout))
    routes:
      - route: ((host))/((path))
    services:
      - camd-pg-db
      - log-drain
