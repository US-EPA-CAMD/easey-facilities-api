instances: 2
environment: performance
host: api-easey-perf.app.cloud.gov
apiHost: api.epa.gov/easey/perf
certOfRepApi:  https://cbsstagei.epa.gov/CBSD/api/facilities-mgmt/certOfRep
maxConnectionPool: 15
idleTimeout: 30000
connectionTimeout: 10000
statementTimeout: 300000
idleInTransactionSessionTimeout: 300000
maxUsesBeforeRecreatingConnection: 500
sqlLogging: "error"
maxQueryExecutionTime: 30000
enableAuditLog: true
healthCheckInterval: 30
healthCheckInvocationTimeout: 60
dbHealthTimeout: 300000