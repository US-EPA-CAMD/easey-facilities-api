#THIS FILE SHOULD CONTAIN DEV SETTINGS AND CI/CD WORKFLOW WILL CHANGE SETTINGS BASED ON ENV
disk: 1024
memory: 1024
instances: 1
name: facilities-api
host: api-easey-dev.app.cloud.gov
port: 8080
path: facilities-mgmt
title: Facilities Management
description: Facility management API endpoints for power sector facilities and their attributes (e.g. units, stacks, and owners)
environment: development
apiHost: api.epa.gov/easey/dev
dbSvc: camd-pg-db
certOfRepApi: https://cbsstagei.epa.gov/CBSD/api/facilities-mgmt/certOfRep
maxConnectionPool: 15
idleTimeout: 30000
connectionTimeout: 10000
statementTimeout: 300000
idleInTransactionSessionTimeout: 300000
maxUsesBeforeRecreatingConnection: 500
sqlLogging: "error"
maxQueryExecutionTime: 30000
enableAuditLog: true
healthCheckInterval: 30
healthCheckInvocationTimeout: 60
dbHealthTimeout: 5000