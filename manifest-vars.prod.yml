instances: 2
environment: production
host: api-easey.app.cloud.gov
apiHost: api.epa.gov/easey
certOfRepApi: https://camd.epa.gov/CBS/api/facilities-mgmt/certOfRep
maxConnectionPool: 15
idleTimeout: 30000
connectionTimeout: 10000
statementTimeout: 300000
idleInTransactionSessionTimeout: 300000
maxUsesBeforeRecreatingConnection: 500
sqlLogging: "error"
maxQueryExecutionTime: 30000
enableAuditLog: true
healthCheckInterval: 30
healthCheckInvocationTimeout: 60
dbHealthTimeout: 300000